{% load static %}
<div class="autocomplete-container">
    <!-- Hidden input for the actual value (ID) -->
    <input type="hidden"
           name="{{ widget.name }}"
           id="{{ widget.attrs.id }}"
           value="{{ widget.value|default:'' }}">
    <!-- Visible input for search/display -->
    <input type="text"
           id="{{ widget.attrs.id }}_display"
           value="{{ widget.display_value }}"
           placeholder="{{ widget.placeholder|default:'Type to search...' }}"
           name="q"
           hx-get="{{ widget.search_url }}"
           hx-trigger="input changed delay:300ms, focus"
           hx-target="#{{ widget.attrs.id }}_results"
           hx-swap="innerHTML"
           hx-vals='{"widget_id": "{{ widget.attrs.id }}"{% for key, value in widget.search_params.items %}, "{{ key }}": "{{ value }}"{% endfor %}}'
           autocomplete="off"
           class="autocomplete-input">
    <!-- Results container -->
    <div id="{{ widget.attrs.id }}_results"
         class="autocomplete-results autocomplete-results-positioned"></div>
    <!-- Inline form container (for location creation) -->
    {% if widget.create_url %}
        <div id="{{ widget.attrs.id }}_inline_form"
             class="autocomplete-inline-form"></div>
    {% endif %}
</div>

<script>
function selectSingle(itemId, itemText, widgetId) {
    // Set the hidden input value (the actual form field)
    const hiddenInput = document.getElementById(widgetId);
    if (hiddenInput) {
        hiddenInput.value = itemId;
    }

    // Set the display input value
    const displayInput = document.getElementById(widgetId + '_display');
    if (displayInput) {
        displayInput.value = itemText;
    }

    // Clear the results
    const results = document.getElementById(widgetId + '_results');
    if (results) {
        results.innerHTML = '';
    }
}

if (typeof window.openCreateForm === 'undefined') {
    window.openCreateForm = function(widgetId, searchInputId) {
        const query = document.getElementById(searchInputId).value;
        const createButton = event.target;
        const currentVals = JSON.parse(createButton.getAttribute('hx-vals') || '{}');
        currentVals.q = query;
        createButton.setAttribute('hx-vals', JSON.stringify(currentVals));

        // Clear results after short delay
        setTimeout(() => {
            document.getElementById(widgetId + '_results').innerHTML = '';
        }, 100);
    };
}

// Close autocomplete results when clicking outside
document.addEventListener('click', function(event) {
    document.querySelectorAll('.autocomplete-container').forEach(container => {
        const results = container.querySelector('.autocomplete-results');
        if (results && !container.contains(event.target)) {
            results.innerHTML = '';
        }
    });
});
</script>
