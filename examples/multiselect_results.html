{% load i18n %}
{% if results %}
    {% for item in results %}
        <div class="multiselect-autocomplete-item"
             data-testid="{{ widget_id }}-search-result-item"
             onclick="selectMultiple({{ item.id }}, '{{ item|escapejs }}', '{{ widget_id }}')">
            {{ item }}
            <span class="add-indicator">+</span>
        </div>
    {% endfor %}
{% else %}
    <div class="multiselect-no-results" data-testid="{{ widget_id }}-no-results">{% trans "No results found" %}</div>
{% endif %}

{% if create_url %}
    <div class="multiselect-create-item"
         data-testid="{{ widget_id }}-create-new-item"
         data-action="create"
         hx-get="{% url create_url %}"
         hx-target="#{{ widget_id }}_inline_form"
         hx-swap="innerHTML"
         hx-vals='{"widget_id": "{{ widget_id }}"{% for key, value in search_params.items %}, "{{ key }}": "{{ value }}"{% endfor %}}'
         hx-on:click="openCreateForm('{{ widget_id }}', '{{ widget_id }}_search')">
        {% trans "+ Create new" %}
    </div>
{% endif %}
