{% load static %}
<div class="multiselect-container" id="{{ widget.attrs.id }}_container">
    <!--  Hidden input to track selected IDs for HTMX  -->
    <input type="hidden" name="excluded_ids" data-selected-ids="{{ widget.attrs.id }}" id="{{ widget.attrs.id }}_excluded_ids" value="{% for item in widget.selected_items %}{{ item.id }}{% if not forloop.last %},{% endif %}{% endfor %}" />
    <!--  Selected items display  -->
    <div class="selected-items" id="{{ widget.attrs.id }}_selected" data-testid="{{ widget.attrs.id }}_selected">
        {% for item in widget.selected_items %}
            <div class="item-tag" data-id="{{ item.id }}" data-testid="{{ widget.attrs.id }}-selected-item">
                <span>{{ item.label }}</span>
                <button type="button" class="remove-item" data-testid="{{ widget.attrs.id }}-remove-item-{{ item.id }}" onclick="removeElement({{ item.id }}, '{{ widget.attrs.id }}')" aria-label="Remove {{ item.label|escapejs }}">×</button>
            </div>
        {% endfor %}
    </div>
    <!--  Search input  -->
    <div class="multiselect-search-input">
        <input type="text" name="q" id="{{ widget.attrs.id }}_search" placeholder="{{ widget.placeholder }}" hx-get="{{ widget.search_url }}" hx-trigger="input changed delay:300ms, focus" hx-target="#{{ widget.attrs.id }}_results" hx-swap="innerHTML" hx-vals="{"widget_id": "{{ widget.attrs.id }}"{% for key, value in widget.search_params.items %}, "{{ key }}": "{{ value }}"{% endfor %}}" hx-include="[data-selected-ids='{{ widget.attrs.id }}']" autocomplete="off" />
        <!--  Results container  -->
        <div id="{{ widget.attrs.id }}_results" class="multiselect-results"></div>
        <!--  Inline form container  -->
        {% if widget.create_url %}
            <div id="{{ widget.attrs.id }}_inline_form" class="autocomplete-inline-form"></div>
        {% endif %}
    </div>
</div>
{#  Hidden select element - this is what actually gets submitted  #}
<div style="display: none;">{% include "django/forms/widgets/select.html" %}
</div>
<script>
    
function updateSelectedIds(widgetId) {
    const container = document.getElementById(widgetId + '_selected');
    const hiddenInput = document.getElementById(widgetId + '_excluded_ids');

    if (container && hiddenInput) {
        const selectedIds = Array.from(container.querySelectorAll('.item-tag')).map(tag =>
            tag.getAttribute('data-id')
        );
        hiddenInput.value = selectedIds.join(',');
    }
}

function addElement(elementId, displayText, widgetId) {
    const container = document.getElementById(widgetId + '_selected');
    const widgetContainer = document.getElementById(widgetId + '_container');
    const select = widgetContainer.parentElement.querySelector('select');

    // Check if already selected
    if (container.querySelector(`[data-id="${elementId}"]`)) {
        return; // Already added
    }

    // Add option to select if it doesn't exist
    if (!select.querySelector(`option[value="${elementId}"]`)) {
        const option = document.createElement('option');
        option.value = elementId;
        option.text = displayText;
        select.appendChild(option);
    }

    // Select the option
    select.querySelector(`option[value="${elementId}"]`).selected = true;

    // Create visual tag
    const tag = document.createElement('div');
    tag.className = 'item-tag';
    tag.setAttribute('data-id', elementId);
    tag.setAttribute('data-testid', `${widgetId}-selected-item`);
    tag.innerHTML = `
        <span>${displayText}</span>
    <button type="button" class="remove-item" data-testid="${widgetId}-remove-item-${elementId}" onclick="removeElement(${elementId}, '${widgetId}')" aria-label="Remove ${displayText}">×</button>
    
    `;
    container.appendChild(tag);

    // Clear search and hide results
    document.getElementById(widgetId + '_search').value = '';
    document.getElementById(widgetId + '_results').innerHTML = '';

    // Update excluded IDs for HTMX
    updateSelectedIds(widgetId);
}

function removeElement(elementId, widgetId) {
    // Remove visual tag
    const container = document.getElementById(widgetId + '_selected');
    const tag = container.querySelector(`[data-id="${elementId}"]`);
    if (tag) tag.remove();

    // Unselect in form
    const widgetContainer = document.getElementById(widgetId + '_container');
    const select = widgetContainer.parentElement.querySelector('select');
    const option = select.querySelector(`option[value="${elementId}"]`);
    if (option) option.selected = false;

    // Update excluded IDs for HTMX
    updateSelectedIds(widgetId);
}

function selectMultiple(itemId, itemText, widgetId) {
    // For multi-select widgets, just call addElement
    addElement(itemId, itemText, widgetId);
}

function openCreateForm(widgetId, searchInputId) {
    const query = document.getElementById(searchInputId).value;
    const createButton = event.target;
    const currentVals = JSON.parse(createButton.getAttribute('hx-vals') || '{}');
    currentVals.q = query;
    createButton.setAttribute('hx-vals', JSON.stringify(currentVals));

    // Clear results after short delay
    setTimeout(() => {
        document.getElementById(widgetId + '_results').innerHTML = '';
    }, 100);
}

// Close autocomplete results when clicking outside
document.addEventListener('click', function(event) {
    document.querySelectorAll('.multiselect-container').forEach(container => {
        const results = container.querySelector('.multiselect-results');
        if (results && !container.contains(event.target)) {
            results.innerHTML = '';
        }
    });
});
</script>
